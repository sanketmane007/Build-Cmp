<template>
    <lightning-card title={post.Title__c}>

        <template if:true={viewMode}>
             <div class="slds-p-around_medium">
                    <lightning-formatted-rich-text value={content}></lightning-formatted-rich-text>
             
            </div>
            <div class="slds-p-around_medium">
                <lightning-button label="Edit" onclick={handleEdit} class="slds-m-top_medium">
                     </lightning-button>
            </div>
           
        </template>

        <template if:false={viewMode}>
            <div class="slds-p-around_medium">
                    <lightning-input-rich-text value={content} placeholder='' onchange={handleContentChange}>
                    </lightning-input-rich-text>
                </div>
            <div class="slds-p-around_medium">
                <lightning-button label="Save" onclick={handleSave} class="slds-p-around_medium"></lightning-button>
                <lightning-button label="Cancel" onclick={handleCancel} class="slds-p-around_medium"></lightning-button>
            </div>
        </template>
        <br />
        <c-inv-comment-list post-id={post.Id}></c-inv-comment-list>
    </lightning-card>
</template>
