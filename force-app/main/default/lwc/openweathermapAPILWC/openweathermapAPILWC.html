<template>

    <template if:true={isSpinning}>
        <!-- Spinner LWC CMP  InvgalaxySpinner -->
        <div class="spinner-overlay">
            <c-invgalaxy-spinner is-spinning={isSpinning} class="slds-text-align_center"></c-invgalaxy-spinner>
        </div>
    </template>"
    <!-- Lightning Card for Weather API -->
    <lightning-card title="Weather API">
        <!-- Container for input and button -->
        <div class="slds-var-m-around_medium">
            <!-- Input for city name -->
            <lightning-input label="Enter City Name" value={changeCityName} type="text" onchange={handleCityChange}>
            </lightning-input>
            <!-- Button to fetch weather data -->
            <lightning-button label="Get Weather" variant="brand" onclick={getWeatherData}>
            </lightning-button>
        </div>
    </lightning-card>

     <lightning-card>
        <template if:true={weatherData}>
        <div class="weather-container">
            <lightning-layout multiple-rows="true">

                <lightning-layout-item padding="around-small" size="12">
                    <div class="page-section page-header">
                        <h1>Weather in {changeCityName}</h1>
                        <div class="weather-main">
                            <img src={weatherData.iconURL} alt={weatherData.Main} />
                        </div>
                    </div>
                </lightning-layout-item>
                <lightning-layout-item padding="around-small" size="12">
                    <p>{weatherData.description}</p>
                </lightning-layout-item>
                <lightning-layout-item padding="around-small" size="12">
                    <lightning-layout multiple-rows="true">
                        <lightning-layout-item padding="around-small" size="1">

                        </lightning-layout-item>
                        <lightning-layout-item padding="around-small" size="3">
                            <p>Temperature: {weatherData.temperature}°C</p>
                        </lightning-layout-item>
                        <lightning-layout-item padding="around-small" size="3">
                            <p>Feels Like: {weatherData.feelsLike}°C</p>
                        </lightning-layout-item>
                        <lightning-layout-item padding="around-small" size="3">
                            <p>Humidity: {weatherData.humidity}%</p>
                        </lightning-layout-item>
                        <lightning-layout-item padding="around-small" size="2">

                        </lightning-layout-item>

                        <lightning-layout-item padding="around-small" size="1">
                        </lightning-layout-item>
                        <lightning-layout-item padding="around-small" size="3">
                            <p>Pressure: {weatherData.pressure} hPa</p>
                        </lightning-layout-item>
                        <lightning-layout-item padding="around-small" size="3">
                            <p>Visibility: {weatherData.visibility} m</p>
                        </lightning-layout-item>
                        <lightning-layout-item padding="around-small" size="3">
                            <p>Wind Speed: {weatherData.windSpeed} m/s</p>
                        </lightning-layout-item>
                        <lightning-layout-item padding="around-small" size="2">
                            <p>Wind Direction: {weatherData.windDirection}°</p>
                        </lightning-layout-item>
                    </lightning-layout>
                </lightning-layout-item>

            </lightning-layout>

        </div>
        </template>

    </lightning-card> 

</template>
